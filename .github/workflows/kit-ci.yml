name: Kit CI
# Proves every template (and seed) still composes into a project that passes its own checks. Runs on changes to the kit itself.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { template: web-app, seed: '' }
          - { template: cross-platform-app, seed: overcut }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown, components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '${{ runner.temp }}/project -> target' }
      - name: wasm-bindgen CLI (version pinned in the template's crates/wasm/Cargo.toml; cached)
        if: matrix.template == 'cross-platform-app'
        id: wbg
        run: echo "v=$(grep -oP 'wasm-bindgen\s*=\s*"=?\K[0-9.]+' templates/cross-platform-app/crates/wasm/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - if: matrix.template == 'cross-platform-app'
        uses: actions/cache@v4
        id: wbgcache
        with: { path: ~/.cargo/bin/wasm-bindgen, key: 'wasm-bindgen-${{ runner.os }}-${{ steps.wbg.outputs.v }}' }
      - if: matrix.template == 'cross-platform-app' && steps.wbgcache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ steps.wbg.outputs.v }} --locked
      - name: Compose and verify
        run: node tools/check-template.mjs ${{ matrix.template }} "$RUNNER_TEMP/project" --build ${{ matrix.seed && format('--seed {0}', matrix.seed) || '' }}
