name: New project
# Creates a complete project from one of the templates in templates/: GitHub repo, Supabase project, Vercel project, secrets, first issues, first commit.
# Run from the Actions tab or from a Claude session (actions_run_trigger). One-time secrets: see README.md.
on:
  workflow_dispatch:
    inputs:
      template: { description: 'Template folder under templates/', required: true, default: 'web-app' }
      name: { description: 'Display name, e.g. "Habit Tracker"', required: true }
      slug: { description: 'Repo/project slug, e.g. habit-tracker', required: true }
      purpose: { description: 'What the project does (one or two sentences)', required: true }
      visibility: { description: 'private or public', required: false, default: 'private' }
      region: { description: 'Supabase region (functions follow it)', required: false, default: 'ap-south-1' }
permissions:
  contents: read
concurrency: new-project
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Create the project
        env:
          KIT_GH_TOKEN: ${{ secrets.KIT_GH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORG_ID: ${{ secrets.SUPABASE_ORG_ID }}
          KIT_OWNER_EMAIL: ${{ secrets.KIT_OWNER_EMAIL }}
          TEMPLATE: ${{ inputs.template }}
          NAME: ${{ inputs.name }}
          SLUG: ${{ inputs.slug }}
          PURPOSE: ${{ inputs.purpose }}
          VISIBILITY: ${{ inputs.visibility }}
          REGION: ${{ inputs.region }}
        run: |
          case "$TEMPLATE" in ''|*[!a-z0-9-]*) echo "bad template name"; exit 2;; esac
          [ -f "templates/$TEMPLATE/scripts/bootstrap.mjs" ] || { echo "template $TEMPLATE has no scripts/bootstrap.mjs"; exit 2; }
          node "templates/$TEMPLATE/scripts/bootstrap.mjs" --template-dir "templates/$TEMPLATE" --name "$NAME" --slug "$SLUG" --purpose "$PURPOSE" --visibility "$VISIBILITY" --region "$REGION" | tee "$GITHUB_STEP_SUMMARY"
